[package]
name = "coolerscreen"
version = "4.9.1"
description = "CoolerScreen: put your own videos on the Lovingcool SC70 cooler screen"
edition = "2021"
default-run = "coolerscreen"

[lib]
name = "cs_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nusb = "0.2.7"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip"] }
rayon = "1.12"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
serialport = "4.10.1"
sha1 = "0.11.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
dirs = "6"
notify = "8"
miniz_oxide = "0.8"
sha1_smol = "1"
getrandom = "0.3"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_WinRT", "Media_Control", "Storage_Streams", "Graphics_Imaging", "Foundation", "Foundation_Collections"] }
windows-capture = "2.0.1"
jpeg-encoder = { version = "0.6", features = ["simd"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"
tray-icon = "0.25"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_ProcessStatus",  "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Memory"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[[bench]]
name = "media_bench"
harness = false
