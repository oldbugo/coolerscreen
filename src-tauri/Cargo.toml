[package]
name = "coolerscreen"
version = "2.0.0-alpha.0"
description = "CoolerScreen 2.0 spike: Tauri shell + Rust device layer"
edition = "2021"
default-run = "coolerscreen"

[lib]
name = "cs_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nusb = "0.2.7"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
serialport = "4.10.1"
sha1 = "0.11.0"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "2.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
