[package]
name = "coolerscreen"
version = "2.0.0-alpha.0"
description = "CoolerScreen 2.0 spike: Tauri shell + Rust device layer"
edition = "2021"
default-run = "coolerscreen"

[lib]
name = "cs_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nusb = "0.2.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
serialport = "4.10.1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
dirs = "6"
notify = "8"
miniz_oxide = "0.8"
sha1_smol = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
